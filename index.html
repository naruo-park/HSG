<style>
:root{
  --brand:#0b5d4b; --brand-2:#0e7a62; --brand-soft:#e6f2ee;
  --ink:#1b1f1e; --ink-2:#56605d; --ink-3:#8a9491;
  --line:#e3e8e6; --bg:#f5f7f6; --card:#fff;
  --warn:#b45309; --warn-soft:#fff4e5; --danger:#b42318; --danger-soft:#fdecea;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:12px 16px 12px;
  padding-top:max(12px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px;max-width:960px;margin:0 auto}
.back{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.back svg{width:20px;height:20px}
.homebtn{flex:none;height:36px;padding:0 12px 0 10px;border-radius:10px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);font-size:14px;font-weight:600}
.homebtn svg{width:19px;height:19px}
.homebtn:active,.back:active{background:rgba(255,255,255,.28)}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub{font-size:12.5px;opacity:.82}
.search{max-width:960px;margin:10px auto 0;position:relative}
.search input{width:100%;height:46px;border-radius:12px;border:0;padding:0 44px 0 42px;font-size:16px;
  background:#fff;color:var(--ink);outline:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.search .ico{position:absolute;left:13px;top:13px;width:20px;height:20px;color:var(--ink-3)}
.search .clr{position:absolute;right:6px;top:5px;width:36px;height:36px;border-radius:10px;color:var(--ink-3);display:grid;place-items:center}

/* tabs */
nav.tabs{display:flex;gap:6px;max-width:960px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px;border-radius:999px;font-size:14px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.tab.on{background:#fff;color:var(--brand);font-weight:700}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#e8590c;color:#fff;font-size:12px;line-height:18px;text-align:center}

main{max-width:960px;margin:0 auto;padding:14px 14px 90px}
.note{font-size:13.5px;color:var(--ink-2);margin:2px 4px 12px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
h2.sec{font-size:14px;color:var(--ink-2);font-weight:700;margin:18px 4px 8px;letter-spacing:-.2px}

/* quick numbers */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qbtn{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.qbtn .qi{width:34px;height:34px;flex:none;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.qbtn .qi svg{width:18px;height:18px}
.qbtn b{display:block;font-size:14.5px}
.qbtn span{display:block;font-size:12.5px;color:var(--ink-2)}

/* group grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.gbtn{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.gbtn:active,.dbtn:active,.qbtn:active{background:var(--brand-soft)}
.gbtn .k{font-size:12px;color:var(--brand);font-weight:700}
.gbtn b{font-size:16.5px;letter-spacing:-.3px}
.gbtn span{font-size:12.5px;color:var(--ink-3)}

/* dept list */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.dbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 16px;border-bottom:1px solid var(--line);text-align:left}
.dbtn:last-child{border-bottom:0}
.dbtn b{font-size:16px}
.dbtn span{font-size:13px;color:var(--ink-3)}
.dbtn .chev{color:var(--ink-3);width:18px;height:18px;flex:none;margin-left:8px}
.dbtn .meta{display:flex;align-items:center}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}
.chip{font-size:13px;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink-2)}

/* entry rows */
.team{margin-bottom:14px}
.team h3{font-size:13.5px;font-weight:700;color:var(--brand);margin:16px 4px 6px;display:flex;justify-content:space-between}
.team h3 span{color:var(--ink-3);font-weight:400}
.row{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 4px;border-bottom:1px solid var(--line);background:var(--card)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:6px 8px;border-radius:10px}
.row .main:hover{background:#f2f5f4}
.av{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.av.s{background:#eef1f8;color:#3c4f8a}.av.f{background:#f3f0ea;color:#7a6234}.av svg{width:18px;height:18px}
.who{min-width:0;flex:1}
.who .nm{font-size:16px;font-weight:600;letter-spacing:-.2px;word-break:keep-all}
.role{display:inline-block;font-size:11.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.edited{display:inline-block;font-size:11px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.duty{flex:1;min-width:0;font-size:12.5px;line-height:1.35;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;padding:0 4px}
.row .who{flex:0 1 auto;max-width:42%}
@media(max-width:520px){.duty.none{display:none}.row .main{flex-wrap:wrap}.row .who{max-width:none;flex:1}.duty{order:3;flex-basis:100%;padding:0 0 0 46px;-webkit-line-clamp:2}}
.wbox{background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px;white-space:pre-line;max-height:220px;overflow:auto}
.wbox b{display:block;font-size:12.5px;color:var(--brand);margin-bottom:4px;white-space:normal}
.lockform{max-width:360px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
mark.hl{background:#ffe9e9;color:#d40000;font-weight:800;border-radius:3px;padding:0 1px}
.who .ctx{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{text-align:right;flex:none}
.num b{display:block;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.num span{display:block;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.num .guide{font-size:13.5px;color:var(--ink-2);font-weight:500}
.ibtn{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--ink-3)}
.ibtn svg{width:20px;height:20px}
.ibtn.star.on{color:#e8a10c}
.ibtn.call{background:var(--brand);color:#fff}
.ibtn.call:active{background:var(--brand-2)}
.ibtn.copy{background:#f3f0ea;color:#7a6234}
.ibtn.ghost{visibility:hidden}

.empty{text-align:center;color:var(--ink-3);padding:40px 16px;font-size:15px}
.count{font-size:13px;color:var(--ink-3);margin:0 4px 8px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media(min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h4{margin:0 0 4px;font-size:18px}
.sheet .desc{font-size:13.5px;color:var(--ink-2);margin:0 0 14px}
.pick{display:flex;flex-direction:column;gap:8px}
.pick a,.pick button.p{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;background:var(--brand-soft);color:var(--brand);text-decoration:none;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.pick a span{font-weight:400;font-size:13px;color:var(--ink-2)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px;color:var(--ink-2)}
.fld input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;background:#fff}
.fld input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fld .hint{font-size:12px;color:var(--ink-3);margin-top:4px}
.cur{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.cur div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.cur span{color:var(--ink-3)}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;height:48px;border-radius:12px;font-weight:700;font-size:16px;background:var(--bg);color:var(--ink)}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:disabled{opacity:.45}
.btn.red{background:var(--danger-soft);color:var(--danger)}
.btn.sm{height:38px;font-size:14px;flex:none;padding:0 14px}
.callrow{display:flex;gap:8px;margin-bottom:14px}
.callrow a,.callrow button{flex:1;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;text-decoration:none}
.callrow a{background:var(--brand);color:#fff}
.callrow button{background:var(--bg)}
.callrow svg{width:18px;height:18px}

/* admin */
.req{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.req .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-3);margin-bottom:8px}
.req .where{font-size:13.5px;color:var(--brand);font-weight:700;margin-bottom:6px}
.diff{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;align-items:center;font-size:15px;margin-bottom:10px}
.diff .lb{font-size:12.5px;color:var(--ink-3)}
.diff .old{color:var(--ink-2)}
.diff .new{font-weight:700}
.diff .chg{color:var(--danger)}
.diff .arr{color:var(--ink-3)}
.st{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}
.st.accepted{background:var(--brand-soft);color:var(--brand)}
.st.deleted{background:#eef0ef;color:var(--ink-2)}
.st.reverted{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b1f1e;color:#fff;padding:11px 16px;border-radius:12px;font-size:14.5px;z-index:80;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
footer{max-width:960px;margin:0 auto;padding:0 18px 30px;font-size:12px;color:var(--ink-3)}
footer .made{margin-top:10px;text-align:center;font-size:12.5px;font-weight:600;color:var(--brand);letter-spacing:.2px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <button class="back hidden" id="back" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="ttl"><h1 id="title">횡성군 행정전화번호</h1><div class="sub" id="subtitle"></div></div>
    <button class="homebtn" id="home" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>홈</span></button>
  </div>
  <div class="search">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="이름·부서·팀·번호 검색 (초성 가능)" aria-label="검색">
    <button class="clr hidden" id="clr" aria-label="지우기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<footer id="foot"></footer>

function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = new TextEncoder().encode(str), l = bytes.length;
  const n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n); m.set(bytes); m[l] = 0x80;
  const bl = l * 8; for (let i = 0; i < 4; i++) m[n - 1 - i] = (bl >>> (8 * i)) & 255;
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W = new Uint32Array(64), r = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < n; o += 64){
    for (let i = 0; i < 16; i++) W[i] = (m[o+4*i] << 24) | (m[o+4*i+1] << 16) | (m[o+4*i+2] << 8) | m[o+4*i+3];
    for (let i = 16; i < 64; i++){ const s0 = r(W[i-15],7) ^ r(W[i-15],18) ^ (W[i-15] >>> 3), s1 = r(W[i-2],17) ^ r(W[i-2],19) ^ (W[i-2] >>> 10); W[i] = (W[i-16] + s0 + W[i-7] + s1) | 0; }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++){
      const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = H.map((v, i) => (v + [a,b,c,d,e,f,g,h][i]) | 0);
  }
  return H.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}

/* ---------- phone number parsing ---------- */
function fullOf(p){
  p = p.trim();
  if (/^\d{4}$/.test(p)) return '033-340-' + p;
  if (/^\d{3,4}-\d{4}$/.test(p)) return '033-' + p;
  return p;
}
function telOf(full){ return full.replace(/[^\d+]/g, ''); }
function parseNum(raw){
  raw = (raw || '').trim();
  if (!raw) return {type:'none', text:'번호 없음', list:[]};
  if (/[가-힣a-zA-Z+]/.test(raw)) return {type:'guide', text:raw, list:[]};
  let parts;
  const m = raw.match(/^([\d\- ~]+)\(([\d\- ~]+)\)$/);
  if (m) parts = [m[1], m[2]]; else parts = raw.split(/\s*[,\/]\s*/);
  const list = [];
  parts.forEach(p => {
    p = p.trim(); if (!p) return;
    const r = p.match(/^([\d-]+)~(\d+)$/);
    if (r){
      const start = r[1], endTail = r[2], L = endTail.length;
      const prefix = start.slice(0, start.length - L);
      const s = parseInt(start.slice(-L), 10), e = parseInt(endTail, 10);
      if (!isNaN(s) && !isNaN(e) && e >= s && e - s <= 30){
        for (let n = s; n <= e; n++) list.push(prefix + String(n).padStart(L, '0'));
        return;
      }
    }
    list.push(p);
  });
  const items = list.map(p => ({short:p, full:fullOf(p)}));
  return {type: items.length > 1 ? 'multi' : 'single', text:raw, list:items};
}

/* ---------- search ---------- */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function cho(s){
  let o = '';
  for (const ch of s){
    const c = ch.charCodeAt(0) - 0xAC00;
    o += (c >= 0 && c < 11172) ? CHO[Math.floor(c / 588)] : ch;
  }
  return o;
}
// 검색용 정리: 띄어쓰기·줄바꿈·기호를 모두 없애고 글자와 숫자만 남김 (입력값과 자료 모두 같은 방식)
const norm = s => (s || '').normalize('NFC').toLowerCase().replace(/[^0-9a-z가-힣ㄱ-ㅎㅏ-ㅣ]/g, '');
function haystack(e){
  const c = cur(e);
  const pn = parseNum(c.num);
  const nums = pn.list.map(x => x.full.replace(/\D/g,'')).join(' ');
  const txt = [c.name, c.role, c.dept, c.team].join(' ');
  return {t:norm(txt), n:norm(c.num) + ' ' + nums, c:norm(cho(txt)), w:norm(e.duty)};
}
function search(q){
  const nq = norm(q);
  if (!nq) return [];
  const isCho = /^[ㄱ-ㅎ]+$/.test(nq);
  const isNum = /^\d+$/.test(nq);
  const out = [];
  for (const e of BASE){
    const h = haystack(e);
    let score = -1;
    const c = cur(e);
    if (isNum){ if (h.n.includes(nq)) score = norm(c.num).startsWith(nq) ? 0 : 1; }
    else if (isCho){
      const cn = norm(cho(c.name));
      if (cn.startsWith(nq)) score = 0; else if (h.c.includes(nq)) score = 2;
    } else {
      const nn = norm(c.name);
      if (nn === nq) score = 0; else if (nn.startsWith(nq)) score = 1;
      else if (norm(c.dept) === nq || norm(c.team) === nq) score = 2;
      else if (h.t.includes(nq)) score = 3;
      else if (h.w.includes(nq)) score = 4;
    }
    if (score >= 0) out.push([score, e]);
  }
  out.sort((a,b) => a[0] - b[0] || a[1].order - b[1].order);
  return out.map(x => x[1]);
}

/* ---------- 검색어 강조 (띄어쓰기·기호를 무시하고 찾은 부분을 원문 위치로 되돌려 표시) ---------- */
function hl(text, q){
  text = text == null ? '' : String(text);
  const nq = norm(q || '');
  if (!nq || !text) return text;
  const isCho = /^[ㄱ-ㅎ]+$/.test(nq);
  const chars = Array.from(text);
  const tryMap = (useCho) => {
    let flat = ''; const pos = [];
    chars.forEach((ch, i) => { const n = norm(useCho ? cho(ch) : ch); for (const x of n){ flat += x; pos.push(i); } });
    const ranges = []; let from = 0, k;
    while ((k = flat.indexOf(nq, from)) !== -1){ ranges.push([pos[k], pos[k + nq.length - 1]]); from = k + nq.length; }
    return ranges;
  };
  let ranges = tryMap(false);
  if (!ranges.length && isCho) ranges = tryMap(true);
  if (!ranges.length) return text;
  const out = []; let last = 0;
  ranges.forEach(([a, b]) => {
    if (a < last) return;
    if (a > last) out.push(chars.slice(last, a).join(''));
    out.push(h('mark', {class:'hl'}, chars.slice(a, b + 1).join('')));
    last = b + 1;
  });
  if (last < chars.length) out.push(chars.slice(last).join(''));
  return out;
}

/* ---------- DOM helpers ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v; // only static, trusted markup (icons)
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
  }
  return el;
}

async function copyText(s){
  try { await navigator.clipboard.writeText(s); toast('복사했습니다: ' + s); }
  catch(e){
    const ta = h('textarea', {style:'position:fixed;opacity:0'}); ta.value = s; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('복사했습니다: ' + s); } catch(_){ toast(s); }
    ta.remove();
  }
}

/* ---------- requests: storage ---------- */
async function submitRequest(e, newName, newNum, requester){
  const c = cur(e);
  const item = {
    rid: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    eid: e.id, dept: c.dept, team: c.team, oldName: c.name, oldNum: c.num,
    newName, newNum, requester, at: Date.now()
  };
  if (db && myId){
    try {
      const ref = db.doc('requests/' + myId);
      const snap = await ref.get();
      const items = (snap.exists && Array.isArray(snap.data().items)) ? snap.data().items.slice() : [];
      items.push(item);
      await ref.set({items: items.slice(-300), uid: myId});
      return true;
    } catch(err){
      if (err && err.code === 'invalid_argument'){ canRequest = false; toast('요청을 저장할 권한이 없습니다. 관리자에게 참여 권한을 요청하세요.'); }
      else if (err && err.code === 'quota_exceeded') toast('저장 공간이 가득 찼습니다. 관리자에게 알려 주세요.');
      else toast('보내지 못했습니다. 잠시 후 다시 시도해 주세요.');
      return false;
    }
  }
  // 저장소가 없을 때: 이 기기에만 보관(시험용)
  const local = store.get('localReq', []); local.push(item); store.set('localReq', local);
  myItems = local; if (!db) allRequests = local;
  render();
  return true;
}

async function decide(item, status){
  const prev = cur(BYID[item.eid]);
  const now = Date.now();
  const dec = {status, at: now, by: myId || 'local', prevName: prev.name, prevNum: prev.num, eid: item.eid,
    newName: item.newName, newNum: item.newNum, requester: item.requester, dept: item.dept, team: item.team, reqAt: item.at};
  if (db){
    try {
      if (status === 'accepted') await db.doc('edits/' + item.eid).set({name:item.newName, num:item.newNum, rid:item.rid, at:now, by:myId || ''});
      await db.doc('decisions/' + item.rid).set(dec);
      toast(status === 'accepted' ? '수락했습니다. 자료가 바뀌었습니다.' : '요청을 삭제했습니다. 기존 자료는 그대로입니다.');
    } catch(err){ toast('처리하지 못했습니다. 관리자 암호와 함께 이 앱의 편집 권한이 필요합니다.'); }
    return;
  }
  if (status === 'accepted'){ EDITS[item.eid] = {name:item.newName, num:item.newNum}; store.set('localEdits', EDITS); }
  decisions[item.rid] = dec; store.set('localDec', decisions);
  toast(status === 'accepted' ? '수락했습니다(이 기기 시험 모드).' : '요청을 삭제했습니다. 기존 자료는 그대로입니다.');
  render();
}
async function revert(rid){
  const d = decisions[rid]; if (!d) return;
  const base = BYID[d.eid];
  const backToBase = d.prevName === base.name && d.prevNum === base.num;
  if (db){
    try {
      if (backToBase) await db.doc('edits/' + d.eid).delete();
      else await db.doc('edits/' + d.eid).set({name:d.prevName, num:d.prevNum, rid:rid, at:Date.now(), by:myId || ''});
      await db.doc('decisions/' + rid).set(Object.assign({}, d, {status:'reverted', revertedAt:Date.now()}));
      toast('되돌렸습니다.');
    } catch(err){ toast('되돌리지 못했습니다. 관리자 암호와 함께 이 앱의 편집 권한이 필요합니다.'); }
    return;
  }
  if (backToBase) delete EDITS[d.eid]; else EDITS[d.eid] = {name:d.prevName, num:d.prevNum};
  store.set('localEdits', EDITS);
  decisions[rid] = Object.assign({}, d, {status:'reverted', revertedAt:Date.now()}); store.set('localDec', decisions);
  toast('되돌렸습니다.'); render();
}

function dutySummary(t, q){
  const nq = norm(q || '');
  const items = dutyItems(t);
  if (!nq) return items.join(' · ');
  // 검색어가 든 업무를 맨 앞으로 (두 줄 안에 보이도록)
  const hit = items.filter(x => norm(x).includes(nq)), rest = items.filter(x => !norm(x).includes(nq));
  return hit.concat(rest).join(' · ');
}
function dutyItems(t){
  return t.split('\n').map(l => l.replace(/^[\s○●◦•·▪■□◎※◇◆▶▷☞\-–]+/, '').replace(/^\(?\d+[.)]\s*/, '').replace(/^[\s○●◦•·◇◆\-]+/, '').trim()).filter(Boolean);
}

/* ---------- 엑셀 내려받기 (처음 서식 그대로, 수락된 수정 반영) ---------- */
function colNum(L){ let n = 0; for (const ch of L) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
function colLet(n){ let s = ''; while (n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function splitRef(ref){ const m = ref.match(/^([A-Z]+)(\d+)$/); return [m[1], +m[2]]; }
function setCell(doc, ref, text){
  const NS = doc.documentElement.namespaceURI;
  const [L, rn] = splitRef(ref);
  let rowEl = null;
  for (const r of doc.getElementsByTagNameNS(NS, 'row')) if (r.getAttribute('r') === String(rn)){ rowEl = r; break; }
  if (!rowEl) return false;
  let c = null, before = null;
  for (const x of rowEl.getElementsByTagNameNS(NS, 'c')){
    const xr = x.getAttribute('r');
    if (xr === ref){ c = x; break; }
    if (!before && colNum(splitRef(xr)[0]) > colNum(L)) before = x;
  }
  if (!c){ c = doc.createElementNS(NS, 'c'); c.setAttribute('r', ref); rowEl.insertBefore(c, before); }
  while (c.firstChild) c.removeChild(c.firstChild);
  c.removeAttribute('t');
  text = String(text == null ? '' : text);
  if (text === '') return true;
  if (/^\d{1,9}$/.test(text)){ const v = doc.createElementNS(NS, 'v'); v.textContent = text; c.appendChild(v); }
  else {
    c.setAttribute('t', 'inlineStr');
    const is = doc.createElementNS(NS, 'is'), t = doc.createElementNS(NS, 't');
    t.setAttribute('xml:space', 'preserve'); t.textContent = text; is.appendChild(t); c.appendChild(is);
  }
  return true;
}
function ymd(d){ const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
let dlBusy = false;
async function downloadXlsx(btn){
  if (dlBusy) return; dlBusy = true;
  const old = btn ? btn.textContent : ''; if (btn) btn.textContent = '만드는 중…';
  try {
    if (!window.JSZip) throw new Error('JSZip');
    const zip = await JSZip.loadAsync(document.getElementById('xlsx-template').textContent.trim(), {base64:true});
    const path = 'xl/worksheets/sheet1.xml';
    const doc = new DOMParser().parseFromString(await zip.file(path).async('string'), 'application/xml');
    let n = 0;
    for (const eid in EDITS){
      const e = BYID[eid]; if (!e || !e.cell) continue;
      const c = cur(e);
      const [L, rn] = splitRef(e.cell);
      const nameText = (e.role ? '(' + e.role + ')' : '') + c.name;
      setCell(doc, e.cell, nameText);
      setCell(doc, colLet(colNum(L) + 1) + rn, c.num);
      n++;
    }
    if (n) setCell(doc, 'AA1', ymd(new Date()) + '일자');
    zip.file(path, new XMLSerializer().serializeToString(doc));
    const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const filename = '횡성군_행정전화번호_' + ymd(new Date()).replace(/-/g, '') + '.xlsx';
    const dl = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null;
    if (dl){
      try { await dl.save({filename, data: blob}); toast(n ? '내려받았습니다 (수정 ' + n + '건 반영).' : '내려받았습니다.'); }
      catch(err){
        if (err && err.code === 'declined') toast('내려받기를 취소했습니다.');
        else if (err && err.code === 'rate_limited') toast('잠시 후 다시 눌러 주세요.');
        else if (err && err.code === 'host_unavailable') toast('이 앱에서는 파일 저장이 안 됩니다. 브라우저나 PC에서 열어 주세요.');
        else toast('내려받지 못했습니다.');
      }
    } else if (!window.claude){
      const a = h('a', {href:URL.createObjectURL(blob), download:filename}); document.body.appendChild(a); a.click(); a.remove();
      toast(n ? '내려받았습니다 (수정 ' + n + '건 반영).' : '내려받았습니다.');
    } else toast('이 화면에서는 내려받기를 할 수 없습니다.');
  } catch(err){ toast('엑셀 파일을 만들지 못했습니다. 잠시 후 다시 시도해 주세요.'); }
  finally { dlBusy = false; if (btn) btn.textContent = old; }
}

function render(){
  const q = qEl.value.trim();
  renderTabs();
  let out;
  if (q) out = viewSearch(q);
  else if (route.v === 'group') out = viewGroup(route.id);
  else if (route.v === 'dept') out = viewDept(route.name);
  else if (route.v === 'fav') out = viewFav();
  else if (route.v === 'recent') out = viewRecent();
  else if (route.v === 'admin') out = viewAdmin();
  else out = viewHome();
  view.textContent = '';
  [].concat(out).flat().forEach(n => n && view.appendChild(n));
}
document.getElementById('foot').textContent = '자료: 횡성군 행정전화번호(' + ASOF + '자), 조직 구분: 횡성군청 누리집 조직도. 외부에서는 내선 앞에 033-340을 붙여 겁니다.';
document.getElementById('foot').appendChild(h('div', {class:'made'}, 'Made by AI디지털지원팀장'));

route = parseHash();
render();

function startAdmin(){
  if (!db || adminSub) return;
  adminSub = db.collection('requests').onSnapshot(s => {
    const all = [];
    s.docs.forEach(doc => { const v = doc.data(); if (v && Array.isArray(v.items)) v.items.forEach(it => { if (it && it.rid && it.eid) all.push(it); }); });
    allRequests = all; render();
  }, () => { toast('요청 목록을 불러오지 못했습니다. 이 앱의 편집 권한이 필요합니다.'); });
}
/* ---------- shared store (optional) ---------- */
(async function connect(){
  try {
    if (!window.claude || typeof window.claude.use !== 'function') throw 0;
    const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    user = u;
    if (u){
      try { myId = await u.id(); } catch(e){}
    }
    if (d && myId){
      db = d;
      let timer = setTimeout(() => toast('공유 자료를 아직 불러오지 못했습니다. 잠시 후 다시 확인됩니다.'), 10000);
      db.collection('edits').onSnapshot(s => {
        clearTimeout(timer);
        const m = {}; s.docs.forEach(doc => { const v = doc.data(); if (v && BYID[doc.id]) m[doc.id] = {name:String(v.name ?? ''), num:String(v.num ?? '')}; });
        EDITS = m; render();
      }, () => clearTimeout(timer));
      db.doc('requests/' + myId).onSnapshot(s => {
        const v = s.exists ? s.data() : null; myItems = v && Array.isArray(v.items) ? v.items : [];
        if (!isAdmin) allRequests = myItems;
      }, () => {});
      db.collection('decisions').onSnapshot(s => {
        const m = {}; s.docs.forEach(doc => { m[doc.id] = doc.data(); }); decisions = m; render();
      }, () => {});
      if (isAdmin) startAdmin();
    } else { throw 0; }
  } catch(e){
    db = null;
    // 시험 모드: 이 기기에만 저장
    EDITS = store.get('localEdits', {}); decisions = store.get('localDec', {});
    myItems = store.get('localReq', []); allRequests = myItems;
  }
  dbReady = true;
  render();
})();
})();
</script>
